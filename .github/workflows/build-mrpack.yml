name: Build modpack

on:
  push:
    branches: [main]
    paths:
      - pack.toml
      - index.toml
      - mods/**
      - config/**
      - resourcepacks/**
      - shaderpacks/**
      - .packwizignore
      - .github/workflows/build-mrpack.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-modpack-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKWIZ_VERSION: v0.0.0-20261014010756-170b22d78595

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: modrinth
            ext: mrpack
          - platform: curseforge
            ext: zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}

      - name: Verify index is up to date
        run: |
          "$(go env GOPATH)/bin/packwiz" refresh
          git diff --exit-code -- pack.toml index.toml

      - name: Add manual-download files to the packwiz cache
        if: matrix.platform == 'modrinth'
        env:
          MANUAL_MODS: immersive-vehicles-craftspeed
        run: |
          import_dir="${XDG_CACHE_HOME:-$HOME/.cache}/packwiz/cache/import"
          mkdir -p "$import_dir"
          for slug in $MANUAL_MODS; do
            meta="mods/${slug}.pw.toml"
            name=$(sed -n 's/^filename = "\(.*\)"$/\1/p' "$meta")
            file_id=$(sed -n 's/^file-id = \([0-9]*\)$/\1/p' "$meta")
            hash_format=$(sed -n 's/^hash-format = "\(.*\)"$/\1/p' "$meta")
            hash=$(sed -n 's/^hash = "\(.*\)"$/\1/p' "$meta")
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")
            curl -fsSL --retry 3 -o "$import_dir/$name" "https://edge.forgecdn.net/files/$((file_id / 1000))/$((file_id % 1000))/$encoded"
            echo "$hash  $import_dir/$name" | "${hash_format}sum" -c -
          done

      - name: Export
        id: export
        env:
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          file="dist/ohm-${GITHUB_SHA::7}-${PLATFORM}.${EXT}"
          "$(go env GOPATH)/bin/packwiz" "$PLATFORM" export --output "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.export.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 14
