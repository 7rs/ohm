name: Build mrpack

on:
  push:
    branches: [main]
    paths:
      - pack.toml
      - index.toml
      - mods/**
      - config/**
      - resourcepacks/**
      - shaderpacks/**
      - .packwizignore
      - .github/workflows/build-mrpack.yml
  pull_request:
    paths:
      - pack.toml
      - index.toml
      - mods/**
      - config/**
      - resourcepacks/**
      - shaderpacks/**
      - .packwizignore
      - .github/workflows/build-mrpack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mrpack-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKWIZ_VERSION: v0.0.0-20261014010756-170b22d78595

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}

      - name: Verify index is up to date
        run: |
          "$(go env GOPATH)/bin/packwiz" refresh
          git diff --exit-code -- pack.toml index.toml

      - name: Export mrpack
        run: |
          mkdir -p dist
          "$(go env GOPATH)/bin/packwiz" modrinth export --output "dist/ohm-${GITHUB_SHA::7}.mrpack"

      - uses: actions/upload-artifact@v7
        with:
          name: ohm-mrpack
          path: dist/*.mrpack
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
