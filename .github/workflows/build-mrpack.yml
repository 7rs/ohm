name: Build modpack

on:
  push:
    branches: [main]
    paths:
      - pack.toml
      - index.toml
      - mods/**
      - config/**
      - resourcepacks/**
      - shaderpacks/**
      - .packwizignore
      - .github/workflows/build-mrpack.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-modpack-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKWIZ_VERSION: v0.0.0-20261014010756-170b22d78595

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: modrinth
            ext: mrpack
          - platform: curseforge
            ext: zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify index is up to date
        run: |
          packwiz refresh
          git diff --exit-code -- pack.toml index.toml

      - name: Export
        id: export
        env:
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          file="dist/ohm-${GITHUB_SHA::7}-${PLATFORM}.${EXT}"
          packwiz "$PLATFORM" export --output "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.export.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 14
